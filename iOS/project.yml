name: Furlog
options:
  bundleIdPrefix: com.shimondeitel.groomlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Furlog:
    type: application
    platform: iOS
    sources:
      - path: Furlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.groomlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Furlog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  FurlogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FurlogTests
      - path: Furlog.storekit
    dependencies:
      - target: Furlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.groomlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  FurlogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FurlogUITests
    dependencies:
      - target: Furlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.groomlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Furlog:
    build:
      targets:
        Furlog: all
        FurlogTests: [test]
        FurlogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Furlog.storekit
    test:
      config: Debug
      storeKitConfiguration: Furlog.storekit
      targets:
        - FurlogTests
        - FurlogUITests
    archive:
      config: Release
